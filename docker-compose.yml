services:
  apriniageosat:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://apriniageosat:Kx9Qm7nP8rT2vW5yZ3aB6cE9fH1jL4mN@postgres:5432/apriniageosatcoid}
      - POSTGRES_URL=${POSTGRES_URL}
      - PRISMA_DATABASE_URL=${PRISMA_DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - KV_URL=${KV_URL}
      - KV_REST_API_URL=${KV_REST_API_URL}
      - KV_REST_API_TOKEN=${KV_REST_API_TOKEN}
      - KV_REST_API_READ_ONLY_TOKEN=${KV_REST_API_READ_ONLY_TOKEN}
      - UPSTASH_SEARCH_REST_URL=${UPSTASH_SEARCH_REST_URL}
      - UPSTASH_SEARCH_REST_TOKEN=${UPSTASH_SEARCH_REST_TOKEN}
      - BLOB_READ_WRITE_TOKEN=${BLOB_READ_WRITE_TOKEN}
      - NEXT_PUBLIC_MEILISEARCH_HOST=${NEXT_PUBLIC_MEILISEARCH_HOST:-http://meilisearch:7700}
      - NEXT_PUBLIC_MEILISEARCH_API_KEY=${NEXT_PUBLIC_MEILISEARCH_API_KEY:-Mx8Yr4Pq7Vz2Nn6Bb3Ff9Cc1Dd5Ee8Aa}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-Zx3Vb9Nm2Qw8Er7Ty4Ui6Op1As5Df0Gh3Jk9Lz6Xc2Vb8Nm4Qw1Er5Ty9Ui}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:8000}
    depends_on:
      - postgres
      - redis
      - meilisearch
    restart: unless-stopped
    networks:
      - app-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-apriniageosatcoid}
      - POSTGRES_USER=${POSTGRES_USER:-apriniageosat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Kx9Qm7nP8rT2vW5yZ3aB6cE9fH1jL4mN}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema_postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - app-network

  meilisearch:
    image: getmeili/meilisearch:v1.5
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-Mx8Yr4Pq7Vz2Nn6Bb3Ff9Cc1Dd5Ee8Aa}
      - MEILI_ENV=${MEILI_ENV:-production}
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:

networks:
  app-network:
    driver: bridge
